server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 charset utf-8;
 # um endereço só pro Google: www vira o domínio principal
 if ($host = www.tcveiculos.com.br) {
  return 301 https://tcveiculos.com.br$request_uri;
 }
 location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
 }
 location ~* \.(webp|png|jpg|svg|woff2|ico)$ {
  expires 7d;
 }
 location ~* \.(txt|xml)$ {
  charset_types text/plain text/xml application/xml;
  try_files $uri =404;
 }
}
